<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小手机</title>
<style>
body { margin: 0; display: flex; justify-content: center; height: 100vh; background: #d9d9e0; font-family: sans-serif; }
.phone { width: 100%; max-width: 430px; background: #f4f4f6; display: flex; flex-direction: column; height: 100%; }
.statusbar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 14px; font-weight: 600; }
.desktop { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 15px; }
.card { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); text-align: center; }
.card h3 { margin: 0 0 8px 0; font-size: 16px; }
.card p { margin: 0 0 15px 0; font-size: 13px; color: #7a7a80; }
.btn { background: #1c1c1e; color: white; padding: 10px 22px; border-radius: 20px; border: none; font-size: 14px; }
.app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 10px; margin-top: 6px; }
.app-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.icon-bg { width: 54px; height: 54px; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
.app-label { font-size: 11px; font-weight: 550; }
.dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: rgba(255,255,255,0.6); border-radius: 26px; padding: 10px 6px; margin-top: auto; margin-bottom: 16px; }
.dock .icon-bg { width: 50px; height: 50px; border-radius: 14px; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>23:35</span><span>📶 🔋 100%</span></div>
  <div class="desktop">
    <div class="card">
      <h3>✅ 小手机服务器已连接</h3>
      <p>短代码纯净版，绝对不白屏！</p>
      <button class="btn" onclick="alert('网页可以正常交互！')">点我测试</button>
    </div>
    <div class="app-grid">
      <div class="app-icon"><div class="icon-bg" style="background:#8b87a8">💬</div><span class="app-label">聊天</span></div>
      <div class="app-icon"><div class="icon-bg" style="background:#8fa8b8">📖</div><span class="app-label">世界书</span></div>
      <div class="app-icon"><div class="icon-bg" style="background:#a8a0c4">🧠</div><span class="app-label">记忆</span></div>
      <div class="app-icon"><div class="icon-bg" style="background:#b8a894">📁</div><span class="app-label">档案</span></div>
    </div>
    <div class="dock">
      <div class="app-icon"><div class="icon-bg" style="background:#94b0a0">🛍️</div><span class="app-label">商店</span></div>
      <div class="app-icon"><div class="icon-bg" style="background:#c4a8a0">🔔</div><span class="app-label">通知</span></div>
      <div class="app-icon"><div class="icon-bg" style="background:#b0a4c0">🎨</div><span class="app-label">美化</span></div>
      <div class="app-icon"><div class="icon-bg" style="background:#9a9aa4">⚙️</div><span class="app-label">设置</span></div>
    </div>
  </div>
</div>
</body>
</html>
